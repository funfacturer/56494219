<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    
    <!-- Erzwingt die korrekte Skalierung auf Mobilgeräten und sperrt das Zoomen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    
    <!-- iOS / Safari App-Modus Aktivierung -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hau den Maulwurf">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/235/235252.png">

    <!-- Android / Chrome App-Modus Aktivierung über Inline-Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Hau%20den%20Maulwurf%22,%22short_name%22:%22Maulwurf%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%232f6b1b%22,%22theme_color%22:%22%232f6b1b%22,%22orientation%22:%22portrait%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/235/235252.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]} animate">

    <title>Hau den Maulwurf! 🐹🔨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #7bc85e 0%, #2f6b1b 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Füllt den Bildschirm im App-Modus perfekt aus */
            height: 100vh;
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        h1 {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin: 5px 0 10px 0;
            font-size: 1.8rem;
            text-align: center;
        }

        .score-board {
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            gap: 10px;
        }

        .game-container {
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            background: #1e3d0f;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .hole {
            background: #5c3a21;
            border-radius: 50% 50% 20% 20%;
            position: relative;
            overflow: hidden;
            border: 3px solid #3d2514;
            box-shadow: inset 0 6px 6px rgba(0,0,0,0.6);
        }

        .mole {
            width: 80%;
            height: 80%;
            background: #a0522d;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: -100%;
            left: 10%;
            transition: bottom 0.1s ease-out;
            cursor: pointer;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4);
        }

        .mole::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
            top: 25%;
            left: 25%;
            box-shadow: 20px 0 0 black;
        }

        .mole::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 7px;
            background: #ff69b4;
            border-radius: 50%;
            top: 40%;
            left: 41%;
        }

        .mole.up {
            bottom: 5px;
        }

        .start-btn {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e3d0f;
            background: #ffeb3b;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* Versteckt den Vollbild-Trigger-Button, wenn wir uns bereits im App-Modus befinden */
        .fullscreen-prompt {
            position: fixed;
            bottom: 10px;
            font-size: 0.8rem;
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Hau den Maulwurf! 🐹🔨</h1>
    <div class="score-board">
        <span>Punkte: <span id="score">0</span></span>
        <span>|</span>
        <span>Zeit: <span id="time-left">30</span>s</span>
    </div>

    <div class="game-container">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startGame()">Spiel starten!</button>
    
    <div class="fullscreen-prompt" id="fs-prompt">Für echtes Vollbild zum Homescreen hinzufügen!</div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.querySelector('#score');
        const timeLeftBoard = document.querySelector('#time-left');
        const startBtn = document.querySelector('#start-btn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let countdownTimer;
        let moleTimer;

        // Versuche beim Starten des Spiels zusätzlich den nativen Browser-Vollbildmodus zu triggern
        function requestFullscreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                docElm.requestFullscreen();
            } else if (docElm.mozRequestFullScreen) { /* Firefox */
                docElm.mozRequestFullScreen();
            } else if (docElm.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) { /* IE/Edge */
                docElm.msRequestFullscreen();
            }
        }

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(500, 1000); 
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.add('up');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            // Versuche direkt in den Fullscreen zu schalten
            requestFullscreen();
            
            resetGame();
            timeUp = false;
            peep();
            
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeLeftBoard.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timeUp = true;
                    alert('Spiel vorbei! Dein finaler Score ist: ' + score + ' Punkte! 🎉');
                }
            }, 1000);
        }

        function resetGame() {
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            score = 0;
            timeLeft = 30;
            scoreBoard.textContent = score;
            timeLeftBoard.textContent = timeLeft;
            moles.forEach(mole => mole.classList.remove('up'));
        }

        function bonk(e) {
            if(!e.isTrusted) return; 
            score++;
            this.classList.remove('up');
            scoreBoard.textContent = score;
        }

        moles.forEach(mole => {
            mole.addEventListener('click', bonk);
            mole.addEventListener('touchstart', function(e) {
                e.preventDefault(); 
                bonk.call(this, e);
            }, { passive: false });
        });

        // Blendet den Infotext aus, wenn das Spiel bereits "standalone" läuft
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('fs-prompt').style.display = 'none';
        }
    </script>
</body>
</html>
