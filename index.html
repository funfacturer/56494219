<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Cover-View für Notch & Home-Bar auf dem iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    
    <!-- Browser-Theme-Farbe (Statusleiste Android) -->
    <meta name="theme-color" content="#2f6b1b">

    <!-- iOS / Safari App-Modus & Statusleisten-Verschmelzung -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maulwurf">
    
    <!-- 📱 Apple-Touch-Icon für den Homescreen verlinken -->
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- 💻 Icons für die klassische Browser-Leiste (Tabs) -->
    <link rel="icon" type="image/png" href="icon.png" sizes="32x32">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">

    <!-- ⚙️ Das Inline-Webmanifest, das den schwarzen Hintergrund für iOS & Android verhindert -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Hau%20den%20Maulwurf%22,%22short_name%22:%22Maulwurf%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%232f6b1b%22,%22theme_color%22:%22%232f6b1b%22,%22orientation%22:%22portrait%22,%22icons%22:[{%22src%22:%22icon.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Hau den Maulwurf! 🐹🔨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔑 AUTHENTICATION BOX -->
    <div class="auth-container" id="auth-box">
        <h2>🐹 Maulwurf Login</h2>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Anmelden</button>
            <button class="auth-tab" id="tab-register">Registrieren</button>
        </div>
        <input type="email" class="auth-input" id="auth-email" placeholder="E-Mail-Adresse" autocomplete="email">
        <input type="password" class="auth-input" id="auth-password" placeholder="Passwort (min. 6 Zeichen)">
        <button class="auth-btn" id="auth-submit-btn">Einloggen</button>
    </div>

    <!-- 🎮 MAIN GAME AREA -->
    <div class="hidden" id="game-area" style="display: flex; flex-direction: column; align-items: center;">
        
        <h1>Hau den Maulwurf! 🐹</h1>

        <!-- Realtime Supabase Leaderboard -->
        <div class="leaderboard">
            <h2>🏆 Bestenliste (Top 3)</h2>
            <ol class="leaderboard-list" id="leaderboard-list">
                <li style="opacity: 0.5;">Lade Bestenliste...</li>
            </ol>
        </div>

        <div class="score-board">
            <span>Treffer: <span id="score">0</span>/<span id="total-spawns">0</span></span>
            <span>|</span>
            <span>Zeit: <span id="time-left">30</span>s</span>
        </div>

        <!-- Das erweiterte 3x3 Spielfeld mit 9 Erdlöchern -->
        <div class="game-container">
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
        </div>

        <button class="start-btn" id="start-btn">Spiel starten!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
