<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig für mobile Skalierung -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hau den Maulwurf! 🐹🔨</title>
    <style>
        /* --- DESIGN & STYLING --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #7bc85e 0%, #2f6b1b 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none; /* Für iOS Safari */
            touch-action: manipulation; /* Verhindert Double-Tap-to-Zoom Verzögerung auf Handys */
        }

        h1 {
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin: 5px 0;
            font-size: 1.8rem;
            text-align: center;
        }

        .score-board {
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            gap: 10px;
        }

        /* --- RESPONSIVE SPIELFELD --- */
        .game-container {
            width: 90vw; /* Nutzt 90% der Bildschirmbreite auf Handys */
            max-width: 450px; /* Wird auf Desktop-Bildschirmen nicht zu riesig */
            aspect-ratio: 1 / 1; /* Garantiert, dass das Spielfeld immer quadratisch bleibt */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            background: #1e3d0f;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* Ein Erdhügel */
        .hole {
            background: #5c3a21;
            border-radius: 50% 50% 20% 20%;
            position: relative;
            overflow: hidden;
            border: 3px solid #3d2514;
            box-shadow: inset 0 6px 6px rgba(0,0,0,0.6);
        }

        /* Der Maulwurf */
        .mole {
            width: 80%;
            height: 80%;
            background: #a0522d;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: -100%;
            left: 10%;
            transition: bottom 0.1s ease-out; /* Noch etwas knackiger für Touch-Reaktionen */
            cursor: pointer;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.4);
        }

        /* Augen und Nase des Maulwurfs */
        .mole::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: black;
            border-radius: 50%;
            top: 25%;
            left: 25%;
            box-shadow: 20px 0 0 black; /* Passt sich mobiler Größe an */
        }

        .mole::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 7px;
            background: #ff69b4;
            border-radius: 50%;
            top: 40%;
            left: 41%;
        }

        .mole.up {
            bottom: 5px;
        }

        /* Start-Button */
        .start-btn {
            margin-top: 15px;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #1e3d0f;
            background: #ffeb3b;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
            -webkit-tap-highlight-color: transparent; /* Verhindert unschönen blauen Kasten beim Tippen auf iOS */
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* Media Query für noch kleinere Smartphones */
        @media (max-width: 360px) {
            h1 {
                font-size: 1.5rem;
            }
            .score-board {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>Hau den Maulwurf! 🐹🔨</h1>
    <div class="score-board">
        <span>Punkte: <span id="score">0</span></span>
        <span>|</span>
        <span>Zeit: <span id="time-left">30</span>s</span>
    </div>

    <div class="game-container">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <button class="start-btn" onclick="startGame()">Spiel starten!</button>

    <!-- --- LOGIK (JAVASCRIPT) --- -->
    <script>
        const holes = document.querySelectorAll('.hole');
        const moles = document.querySelectorAll('.mole');
        const scoreBoard = document.querySelector('#score');
        const timeLeftBoard = document.querySelector('#time-left');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let countdownTimer;
        let moleTimer;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = 600; // randomTime(200, 600); 
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            mole.classList.add('up');

            moleTimer = setTimeout(() => {
                mole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            resetGame();
            timeUp = false;
            peep();
            
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeLeftBoard.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timeUp = true;
                    alert('Spiel vorbei! Dein finaler Score ist: ' + score + ' Punkte! 🎉');
                }
            }, 1000);
        }

        function resetGame() {
            clearInterval(countdownTimer);
            clearTimeout(moleTimer);
            score = 0;
            timeLeft = 30;
            scoreBoard.textContent = score;
            timeLeftBoard.textContent = timeLeft;
            moles.forEach(mole => mole.classList.remove('up'));
        }

        function bonk(e) {
            if(!e.isTrusted) return; // Schutz gegen Bots/Autoclicker
            score++;
            this.classList.remove('up');
            scoreBoard.textContent = score;
        }

        // Event-Listener reagieren mobil verzögerungsfrei
        moles.forEach(mole => {
            mole.addEventListener('click', bonk);
            // Zusätzlicher Touchstart-Listener für extrem schnelles Ansprechverhalten auf Touchscreens
            mole.addEventListener('touchstart', function(e) {
                e.preventDefault(); // Verhindert die nachfolgende Klick-Simulation und Zoom-Trigger
                bonk.call(this, e);
            }, { passive: false });
        });
    </script>
</body>
</html>
